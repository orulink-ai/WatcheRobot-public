server {
    listen 127.0.0.1:18443 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wiki.orulink.ai;
    ssl_certificate /www/server/orulink-gateway/tls/current/fullchain.pem;
    ssl_certificate_key /www/server/orulink-gateway/tls/current/privkey.pem;
    root /www/wwwroot/wiki.orulink.ai/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
