name: Build and publish Wiki

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s wiki/tests -p 'test_*.py'
      - name: Build documentation at the exact commit
        env:
          WIKI_SOURCE_REF: ${{ github.sha }}
        run: npm run docs:build
      - name: Package Wiki
        shell: bash
        run: |
          tar -czf watcherobot-wiki.tar.gz -C wiki/.vitepress/dist .
          sha256sum watcherobot-wiki.tar.gz > watcherobot-wiki.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wiki
          path: |
            watcherobot-wiki.tar.gz
            watcherobot-wiki.tar.gz.sha256

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wiki
      - name: Publish independent documentation channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python wiki/publish.py
